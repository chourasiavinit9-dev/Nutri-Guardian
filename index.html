
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nutri-Guardian Pro | Modern Clinical UI</title>
    <!-- Tailwind CDN with dark mode class strategy -->
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: { extend: {} }
      }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        --primary: #10B981;
        --primary-soft: #ECFDF5;
        --surface: #FFFFFF;
        --background: #F8FAFC;
        --card-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.04), 0 4px 6px -2px rgba(0, 0, 0, 0.02);
        --card-hover-shadow: 0 25px 50px -12px rgba(16, 185, 129, 0.08);
      }
      .dark {
        --surface: #1E293B;
        --background: #0F172A;
        --card-shadow: 0 10px 15px -3px rgba(0,0,0,0.3), 0 4px 6px -2px rgba(0,0,0,0.2);
        --card-hover-shadow: 0 25px 50px -12px rgba(16,185,129,0.12);
      }
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: var(--background);
        color: #0F172A;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
        transition: background-color 0.3s ease, color 0.3s ease;
      }
      html.dark body {
        background-color: #0F172A;
        color: #F1F5F9;
      }
      .glass {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(16px) saturate(180%);
        -webkit-backdrop-filter: blur(16px) saturate(180%);
        transition: background 0.3s ease;
      }
      html.dark .glass {
        background: rgba(15, 23, 42, 0.85);
        border-color: rgba(255,255,255,0.08) !important;
      }
      .bento-card {
        background: white;
        border: 1px solid rgba(226, 232, 240, 0.6);
        border-radius: 1.5rem;
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: var(--card-shadow);
      }
      html.dark .bento-card {
        background: #1E293B;
        border-color: rgba(255,255,255,0.06);
        color: #F1F5F9;
      }
      /* Dark hero cards (bg-slate-900) must NOT be overridden */
      html.dark .bg-slate-900 {
        background-color: #0F172A !important;
      }
      /* Ensure notification dot border works in dark */
      html.dark .border-white {
        border-color: #1E293B !important;
      }
      .bento-card:hover {
        box-shadow: var(--card-hover-shadow);
        transform: translateY(-4px);
        border-color: rgba(16, 185, 129, 0.2);
      }
      .saas-button {
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .saas-button:active {
        transform: scale(0.96);
      }
      .ai-gradient-bg {
        background: linear-gradient(135deg, #10B981 0%, #3B82F6 100%);
      }
      .ai-shimmer {
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
        background-size: 200% 100%;
        animation: shimmer 2s infinite;
      }
      @keyframes shimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }
      .animate-float {
        animation: float 6s ease-in-out infinite;
      }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }
      .custom-scrollbar::-webkit-scrollbar { width: 5px; }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #E2E8F0;
        border-radius: 10px;
      }
      html.dark .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #334155;
      }
      /* ═══════════════════════════════════════════════
         COMPREHENSIVE DARK MODE GLOBAL OVERRIDES
         Covers all components without per-class changes
         ═══════════════════════════════════════════════ */

      /* Root background */
      html.dark #root > div {
        background-color: #0F172A;
      }

      /* Plain white backgrounds → dark surface */
      html.dark .bg-white {
        background-color: #1E293B !important;
      }

      /* Slate-50 → slightly darker surface */
      html.dark .bg-slate-50 {
        background-color: #0F172A !important;
      }

      /* Slate-100 backgrounds → muted dark */
      html.dark .bg-slate-100 {
        background-color: #1E293B !important;
      }

      /* Slate-200 backgrounds */
      html.dark .bg-slate-200 {
        background-color: #334155 !important;
      }

      /* Progress / progress track */
      html.dark .bg-slate-100.rounded-full {
        background-color: #334155 !important;
      }

      /* Light tinted icon backgrounds that look washed in dark */
      html.dark .bg-emerald-50 { background-color: rgba(16,185,129,0.12) !important; }
      html.dark .bg-amber-50   { background-color: rgba(245,158,11,0.12) !important; }
      html.dark .bg-blue-50    { background-color: rgba(59,130,246,0.12) !important; }
      html.dark .bg-purple-50  { background-color: rgba(139,92,246,0.12) !important; }
      html.dark .bg-rose-50    { background-color: rgba(244,63,94,0.12) !important; }
      html.dark .bg-red-50     { background-color: rgba(239,68,68,0.12) !important; }

      /* Text colours */
      html.dark .text-slate-900 { color: #F1F5F9 !important; }
      html.dark .text-slate-800 { color: #E2E8F0 !important; }
      html.dark .text-slate-700 { color: #CBD5E1 !important; }
      html.dark .text-slate-600 { color: #94A3B8 !important; }
      html.dark .text-slate-500 { color: #64748B !important; }
      html.dark .text-slate-400 { color: #94A3B8 !important; }
      html.dark .text-slate-300 { color: #64748B !important; }

      /* Borders */
      html.dark .border-slate-100 { border-color: rgba(255,255,255,0.07) !important; }
      html.dark .border-slate-200 { border-color: rgba(255,255,255,0.10) !important; }
      html.dark .border-slate-300 { border-color: rgba(255,255,255,0.14) !important; }

      /* Inputs & textareas */
      html.dark input:not([type="range"]),
      html.dark textarea,
      html.dark select {
        background-color: #0F172A !important;
        color: #F1F5F9 !important;
        border-color: rgba(255,255,255,0.10) !important;
      }
      html.dark input::placeholder,
      html.dark textarea::placeholder {
        color: #475569 !important;
      }
      html.dark input:focus,
      html.dark textarea:focus {
        border-color: #10B981 !important;
        background-color: #1E293B !important;
      }

      /* Hover backgrounds */
      html.dark .hover\:bg-slate-50:hover  { background-color: #1E293B !important; }
      html.dark .hover\:bg-slate-100:hover { background-color: #334155 !important; }

      /* Dividers */
      html.dark .border-t.border-slate-100,
      html.dark .border-b.border-slate-100 {
        border-color: rgba(255,255,255,0.07) !important;
      }

      /* White/50 backgrounds in overlays */
      html.dark .bg-white\/60,
      html.dark .bg-white\/70,
      html.dark .bg-white\/80,
      html.dark .bg-white\/85 {
        background-color: rgba(15,23,42,0.85) !important;
      }

      /* Stat pill tags */
      html.dark .bg-emerald-50.px-3,
      html.dark .bg-amber-50.px-3,
      html.dark .bg-red-50.px-3 {
        background-color: rgba(255,255,255,0.06) !important;
      }

      /* Scan / result sections that have inline bg-white on dynamic elements */
      html.dark .bento-card .bg-white {
        background-color: #0F172A !important;
      }
      html.dark .bento-card .bg-slate-50 {
        background-color: #0F172A !important;
      }

      /* Scrollbar thumb in dark */
      html.dark ::-webkit-scrollbar-thumb {
        background: #334155;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.11.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="custom-scrollbar">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
